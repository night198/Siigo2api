providers:
  siigo-local:
    baseUrl: http://127.0.0.1:8766/v1
    auth: apiKey
    authHeader: true
    apiKey: "!C:/Siigo2api/.venv/Scripts/python.exe -m siigo_bridge key"
    models:
    # Manufacturer context budgets are pending Siigo confirmation.
      - id: gpt-5.6-sol
        name: GPT-5.6 Sol
        api: openai-responses
        reasoning: true
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000
        tokenizer: o200k
        # Siigo billing units are uncalibrated; these zeros do not mean free.
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
          defaultLevel: low
          requiresEffort: false
          effortMap:
            low: low
            medium: medium
            high: high
            xhigh: xhigh
            max: max
        compat:
          supportsDeveloperRole: true
          supportsReasoningEffort: true
          supportsStrictMode: true
          supportsSamplingParams: false
          statefulResponses: false
          reasoningDisableMode: none-effort
